name: Publish npm package

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Test and publish package
    runs-on: macos-latest

    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality gate before publishing
        run: pnpm run check

      - name: Validate tag and package versions
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package version ($package_version)."
            exit 1
          fi

      - name: Build npm package
        run: pnpm pack

      - name: Prepare release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            function normalized_heading(line) {
              sub(/^##[[:space:]]*/, "", line)
              sub(/^Release[[:space:]]+/, "", line)
              sub(/^v/, "", line)
              sub(/^\[/, "", line)
              sub(/\].*$/, "", line)
              sub(/[[:space:]].*$/, "", line)
              return line
            }
            /^##[[:space:]]/ && normalized_heading($0) == version { in_release=1; next }
            in_release && /^##[[:space:]]/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog section found for version $version."
            exit 1
          fi

      - name: Publish package
        run: npm publish "brewly-${GITHUB_REF_NAME#v}.tgz" --access public

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Brewly $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            "brewly-${version}.tgz"
